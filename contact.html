<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Café Artesanal - Contacto</title>
</head>
<body style="font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4ecf8;">

    <nav style="background-color: #4a2c2a; padding: 15px; text-align: center;">
        <a href="index.html" style="color: white; margin: 0 15px; text-decoration: none;">Inicio</a>
        <a href="about.html" style="color: white; margin: 0 15px; text-decoration: none;">Nosotros</a>
        <a href="contact.html" style="color: white; margin: 0 15px; text-decoration: none; font-weight: bold;">Contacto</a>
    </nav>

    <main style="max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 8px;">
        <h1 style="color: #4a2c2a;">Contáctanos</h1>
        <p style="color: #333; line-height: 1.6;">¿Tienes alguna duda o quieres hacer un pedido?</p>
        <form>
            <p><label style="color: #333;">Nombre:<br><input type="text" name="nombre" style="width: 100%; padding: 8px; margin-top: 5px;"></label></p>
            <p><label style="color: #333;">Correo electrónico:<br><input type="email" name="email" style="width: 100%; padding: 8px; margin-top: 5px;"></label></p>
            <p><label style="color: #333;">Mensaje:<br><textarea name="mensaje" rows="4" style="width: 100%; padding: 8px; margin-top: 5px;"></textarea></label></p>
            <button type="submit" style="background-color: #4a2c2a; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer;">Enviar</button>
        </form>
    </main>

</body>
</html>
